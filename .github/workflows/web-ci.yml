name: Web CI Diagnostics

on:
  push:
    branches:
      - pwa-mvp/remote-profiles-session
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Capture lint diagnostics
        run: |
          set +e
          pnpm lint > lint.log 2>&1
          echo $? > lint.exit
          exit 0

      - name: Capture typecheck diagnostics
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          echo $? > typecheck.exit
          exit 0

      - name: Upload validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            lint.log
            lint.exit
            typecheck.log
            typecheck.exit
          retention-days: 1

      - name: Enforce validation result
        run: |
          test "$(cat lint.exit)" = "0"
          test "$(cat typecheck.exit)" = "0"

      - name: Run architecture guardrails
        run: pnpm guardrails

      - name: Run unit tests
        run: pnpm test

      - name: Build production PWA
        run: pnpm build

      - name: Verify agent index
        run: pnpm ai:index:check
