name: Web CI Diagnostics

on:
  pull_request:
    branches:
      - pwa-mvp/remote-profiles-session
  push:
    branches:
      - pwa-mvp/remote-profiles-session
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture formatting diagnostics
        run: |
          set +e
          pnpm format:check > format.log 2>&1
          echo $? > format.exit
          pnpm format > format-apply.log 2>&1
          git diff --binary > prettier.patch
          exit 0

      - name: Capture lint diagnostics
        run: |
          set +e
          pnpm lint > lint.log 2>&1
          echo $? > lint.exit
          exit 0

      - name: Capture typecheck diagnostics
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          echo $? > typecheck.exit
          exit 0

      - name: Capture architecture diagnostics
        run: |
          set +e
          pnpm guardrails > guardrails.log 2>&1
          echo $? > guardrails.exit
          exit 0

      - name: Capture unit test diagnostics
        run: |
          set +e
          pnpm test > unit.log 2>&1
          echo $? > unit.exit
          exit 0

      - name: Capture production build diagnostics
        run: |
          set +e
          pnpm build > build.log 2>&1
          echo $? > build.exit
          exit 0

      - name: Isolate diagnostics and generate repository index
        run: |
          mkdir -p artifacts/diagnostics
          cp *.log *.exit prettier.patch artifacts/diagnostics/
          rm -f *.log *.exit prettier.patch .ai/diagnostic-trigger.txt
          pnpm ai:index

      - name: Upload validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            artifacts/diagnostics/
            .ai/repo-index.json
            .ai/file-tree.md
          retention-days: 1

      - name: Enforce validation results
        run: |
          test "$(cat artifacts/diagnostics/format.exit)" = "0"
          test "$(cat artifacts/diagnostics/lint.exit)" = "0"
          test "$(cat artifacts/diagnostics/typecheck.exit)" = "0"
          test "$(cat artifacts/diagnostics/guardrails.exit)" = "0"
          test "$(cat artifacts/diagnostics/unit.exit)" = "0"
          test "$(cat artifacts/diagnostics/build.exit)" = "0"
