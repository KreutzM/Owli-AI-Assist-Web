name: Web CI Diagnostics

on:
  pull_request:
    branches:
      - pwa-mvp/remote-profiles-session
  push:
    branches:
      - pwa-mvp/remote-profiles-session
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run architecture guardrails
        run: pnpm guardrails

      - name: Run unit tests
        run: pnpm test

      - name: Capture production build diagnostics
        run: |
          set +e
          pnpm build > build.log 2>&1
          echo $? > build.exit
          exit 0

      - name: Upload production build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            build.exit
          retention-days: 1

      - name: Enforce production build result
        run: test "$(cat build.exit)" = "0"

      - name: Verify agent index
        run: pnpm ai:index:check
