name: Format active speech test

on:
  pull_request:
    paths:
      - tests/e2e/remote-followup.spec.ts
      - .github/workflows/format-active-speech-test.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 39 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format test and refresh index
        run: |
          pnpm exec prettier --write tests/e2e/remote-followup.spec.ts
          pnpm ai:index
          git diff --check

      - name: Commit formatted result and remove helper
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm -- .github/workflows/format-active-speech-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/e2e/remote-followup.spec.ts .ai/file-tree.md .ai/repo-index.json
          git commit -m "test(web): apply repository formatter to speech coverage"
          git push origin "HEAD:${HEAD_BRANCH}"
