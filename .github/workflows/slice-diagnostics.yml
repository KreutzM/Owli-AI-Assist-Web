name: Slice diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  typecheck:
    if: github.head_ref == 'pwa-mvp/camera-streaming-scene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck output
        run: |
          pnpm typecheck > .slice-type-diagnostics.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .slice-type-diagnostics.txt
          git commit -m "ci: capture slice type diagnostics"
          git push origin HEAD:${{ github.head_ref }}
