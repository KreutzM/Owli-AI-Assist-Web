name: Apple browser smoke

# macOS runners are substantially more expensive than Linux runners.
# Run automatically only for PRs that touch Apple/browser-sensitive paths.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Apple test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - webkit
          - safari
          - safari-jpeg
      target_url:
        description: Approved staging custom domain or Cloudflare Pages preview URL
        required: true
        default: https://assist-staging.owli-ai.com
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - src/core/image/**
      - src/platform/camera/**
      - src/platform/image/**
      - src/features/scene/**
      - tests/**
      - tools/safari*.py
      - playwright*.ts
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: apple-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve exact PR preview
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.request.outputs.suite }}
      target_url: ${{ steps.request.outputs.target_url }}
      checkout_ref: ${{ steps.request.outputs.checkout_ref }}
    steps:
      - name: Resolve manual target or exact PR preview
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUITE: ${{ inputs.suite }}
          MANUAL_TARGET_URL: ${{ inputs.target_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            suite="$MANUAL_SUITE"
            target_url="$MANUAL_TARGET_URL"
            checkout_ref="$GITHUB_SHA"
          else
            if [[ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo 'Apple smoke PR CI accepts same-repository branches only.' >&2
              exit 1
            fi

            suite='all'
            checkout_ref="$PR_HEAD_SHA"
            short_head="${checkout_ref:0:7}"
            target_url=''

            for attempt in {1..60}; do
              comments_file="$RUNNER_TEMP/pr-comments.json"
              gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments_file"

              target_url="$(python3 - "$comments_file" "$short_head" <<'PY'
          import json
          import re
          import sys

          comments_path, short_head = sys.argv[1:]
          with open(comments_path, encoding='utf-8') as handle:
              comments = json.load(handle)

          pattern = re.compile(r'https://[0-9a-f]{8}\.owli-ai-assist-web\.pages\.dev')
          for comment in reversed(comments):
              user = comment.get('user') or {}
              body = comment.get('body') or ''
              if user.get('login') != 'cloudflare-workers-and-pages[bot]':
                  continue
              if short_head not in body or 'Deploy successful' not in body:
                  continue
              match = pattern.search(body)
              if match:
                  print(match.group(0))
                  break
          PY
              )"

              if [[ -n "$target_url" ]]; then
                break
              fi
              if [[ "$attempt" == '60' ]]; then
                echo "No successful Cloudflare Pages preview found for PR head $checkout_ref." >&2
                exit 1
              fi
              sleep 10
            done
          fi

          python3 - "$target_url" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = sys.argv[1]
          parsed = urlparse(url)
          host = parsed.hostname or ''
          allowed = (
              parsed.scheme == 'https'
              and parsed.path in ('', '/')
              and not parsed.query
              and not parsed.fragment
              and parsed.username is None
              and parsed.password is None
              and parsed.port is None
              and (
                  host == 'assist-staging.owli-ai.com'
                  or host.endswith('.owli-ai-assist-web.pages.dev')
              )
          )
          if not allowed:
              raise SystemExit(f'Unsupported Apple smoke target: {url}')
          PY

          printf 'suite=%s\n' "$suite" >> "$GITHUB_OUTPUT"
          printf 'target_url=%s\n' "$target_url" >> "$GITHUB_OUTPUT"
          printf 'checkout_ref=%s\n' "$checkout_ref" >> "$GITHUB_OUTPUT"

          echo "Suite: $suite"
          echo "Exact checkout: $checkout_ref"
          echo "Target: $target_url"

  webkit:
    name: macOS Playwright WebKit
    needs: prepare
    if: ${{ needs.prepare.outputs.suite == 'all' || needs.prepare.outputs.suite == 'webkit' }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TARGET_URL: ${{ needs.prepare.outputs.target_url }}
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit only
        run: pnpm exec playwright install webkit

      - name: Run iPhone-profile WebKit matrix on macOS
        run: pnpm exec playwright test --project=webkit

      - name: Run built-staging WebKit matrix on macOS
        run: pnpm exec playwright test --config=playwright.staging.config.ts --project=webkit-staging

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-webkit-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  safari:
    name: macOS desktop Safari
    needs: prepare
    if: ${{ needs.prepare.outputs.suite == 'all' || needs.prepare.outputs.suite == 'safari' || needs.prepare.outputs.suite == 'safari-jpeg' }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TARGET_URL: ${{ needs.prepare.outputs.target_url }}
      SUITE: ${{ needs.prepare.outputs.suite }}
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Show Apple runner versions
        shell: bash
        run: |
          sw_vers
          safaridriver --version
          python3 --version

      - name: Enable and start SafariDriver
        shell: bash
        run: |
          sudo safaridriver --enable
          mkdir -p "$RUNNER_TEMP/apple-safari"
          safaridriver -p 4444 > "$RUNNER_TEMP/apple-safari/safaridriver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apple-safari/safaridriver.pid"
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/apple-safari/safaridriver.log"
          exit 1

      - name: Run real desktop Safari smoke
        if: ${{ env.SUITE != 'safari-jpeg' }}
        shell: bash
        run: |
          python3 tools/safari-smoke.py \
            --target-url "$TARGET_URL" \
            --artifacts "$RUNNER_TEMP/apple-safari"

      - name: Run Safari JPEG diagnostic when available
        if: ${{ env.SUITE == 'safari-jpeg' || env.SUITE == 'all' }}
        shell: bash
        run: |
          if [[ -f tools/safari-jpeg-diagnostic-v2.py ]]; then
            python3 tools/safari-jpeg-diagnostic-v2.py \
              --target-url "$TARGET_URL" \
              --artifacts "$RUNNER_TEMP/apple-safari"
          elif [[ "$SUITE" == 'safari-jpeg' ]]; then
            echo 'Requested Safari JPEG diagnostic is not present in this revision.' >&2
            exit 1
          fi

      - name: Stop SafariDriver
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/apple-safari/safaridriver.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/apple-safari/safaridriver.pid")" || true
          fi

      - name: Upload Safari diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-safari-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-safari/
          retention-days: 7
