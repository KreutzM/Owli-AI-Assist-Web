name: Apple browser smoke

# macOS runners are substantially more expensive than Linux runners.
# Run automatically only for non-draft final heads that touch Apple/browser-sensitive paths.
# Draft preparation commits remain on Web quick CI; ready or subsequently updated review heads gate on full Web CI.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Apple test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - webkit
          - safari
          - safari-jpeg
      target_url:
        description: Approved staging custom domain or Cloudflare Pages preview URL
        required: true
        default: https://assist-staging.owli-ai.com
        type: string
      web_ci_run_id:
        description: Successful Full Web CI run ID for the exact selected revision
        required: true
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/apple-smoke.yml
      - .github/workflows/ci.yml
      - src/app/**
      - src/core/api/**
      - src/core/image/**
      - src/features/remote/**
      - src/features/scene/**
      - src/platform/camera/**
      - src/platform/image/**
      - src/platform/speech/**
      - tools/build-web.mjs
      - tools/safari*.py
      - tools/serve-built-web.mjs
      - playwright*.ts
      - vite.safari-jpeg.config.mjs
      - package.json
      - pnpm-lock.yaml

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: apple-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Gate exact PR revision
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      suite: ${{ steps.request.outputs.suite }}
      target_url: ${{ steps.request.outputs.target_url }}
      checkout_ref: ${{ steps.request.outputs.checkout_ref }}
      web_ci_run_id: ${{ steps.request.outputs.web_ci_run_id }}
      macos_enabled: ${{ steps.request.outputs.macos_enabled }}
    steps:
      - name: Gate free CI and resolve optional live target
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUITE: ${{ inputs.suite }}
          MANUAL_TARGET_URL: ${{ inputs.target_url }}
          MANUAL_WEB_CI_RUN_ID: ${{ inputs.web_ci_run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          macos_enabled='1'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            suite="$MANUAL_SUITE"
            target_url="$MANUAL_TARGET_URL"
            checkout_ref="$GITHUB_SHA"
            web_ci_run_id="$MANUAL_WEB_CI_RUN_ID"

            if [[ ! "$web_ci_run_id" =~ ^[0-9]+$ ]]; then
              echo 'Manual Apple CI requires a numeric successful Full Web CI run ID.' >&2
              exit 1
            fi

            run_file="$RUNNER_TEMP/manual-web-ci-run.json"
            jobs_file="$RUNNER_TEMP/manual-web-ci-jobs.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${web_ci_run_id}" \
              > "$run_file"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${web_ci_run_id}/jobs?per_page=100" \
              > "$jobs_file"

            python3 - "$run_file" "$jobs_file" "$checkout_ref" <<'PY'
          import json
          import sys

          run_path, jobs_path, expected_head = sys.argv[1:]
          with open(run_path, encoding='utf-8') as handle:
              run = json.load(handle)
          with open(jobs_path, encoding='utf-8') as handle:
              jobs = json.load(handle).get('jobs', [])

          if run.get('name') != 'Web CI':
              raise SystemExit('Manual Apple CI run ID does not reference the Web CI workflow.')
          if run.get('head_sha') != expected_head:
              raise SystemExit(
                  f"Manual Apple CI head mismatch: expected {expected_head}, got {run.get('head_sha')}."
              )
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('Manual Apple CI requires a completed successful Web CI run.')

          expected_jobs = [
              'Full Linux aggregate and browser validation',
              'Full Windows mock, staging, and production builds',
          ]
          for name in expected_jobs:
              job = next((item for item in jobs if item.get('name') == name), None)
              if not job:
                  raise SystemExit(f'Manual Apple CI is missing required Full job: {name}.')
              if job.get('status') != 'completed' or job.get('conclusion') != 'success':
                  raise SystemExit(
                      f"Manual Apple CI requires successful {name}; "
                      f"got {job.get('status')}/{job.get('conclusion')}."
                  )
          PY
          else
            if [[ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo 'Apple PR CI accepts same-repository branches only.' >&2
              exit 1
            fi

            suite='all'
            target_url=''
            checkout_ref="$PR_HEAD_SHA"
            web_ci_run_id=''

            runs_file="$RUNNER_TEMP/web-ci-runs.json"
            jobs_file="$RUNNER_TEMP/web-ci-jobs.json"
            for attempt in {1..120}; do
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${checkout_ref}&event=pull_request&per_page=100" \
                > "$runs_file"

              mapfile -t candidate_run_ids < <(
                python3 - "$runs_file" "$checkout_ref" <<'PY'
          import json
          import sys

          runs_path, expected_head = sys.argv[1:]
          with open(runs_path, encoding='utf-8') as handle:
              runs = json.load(handle).get('workflow_runs', [])
          matches = [
              run
              for run in runs
              if run.get('name') == 'Web CI' and run.get('head_sha') == expected_head
          ]
          matches.sort(key=lambda run: run.get('created_at', ''), reverse=True)
          for run in matches[:10]:
              print(run.get('id', ''))
          PY
              )

              full_state='missing'
              web_ci_run_id=''
              for run_id in "${candidate_run_ids[@]}"; do
                [[ -n "$run_id" ]] || continue
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                  > "$jobs_file"

                read -r linux_state windows_state < <(
                  python3 - "$jobs_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              jobs = json.load(handle).get('jobs', [])

          expected = {
              'linux': 'Full Linux aggregate and browser validation',
              'windows': 'Full Windows mock, staging, and production builds',
          }

          def state(name):
              job = next((item for item in jobs if item.get('name') == name), None)
              if not job:
                  return 'missing'
              if job.get('status') != 'completed':
                  return job.get('status') or 'pending'
              return job.get('conclusion') or 'unknown'

          print(state(expected['linux']), state(expected['windows']))
          PY
                )

                if [[ "$linux_state" == 'skipped' && "$windows_state" == 'skipped' ]]; then
                  continue
                fi

                web_ci_run_id="$run_id"
                if [[ "$linux_state" == 'success' && "$windows_state" == 'success' ]]; then
                  full_state='success'
                elif [[ "$linux_state" =~ ^(missing|queued|in_progress|waiting|requested|pending)$ ||
                        "$windows_state" =~ ^(missing|queued|in_progress|waiting|requested|pending)$ ]]; then
                  full_state='pending'
                else
                  full_state="failed:${linux_state}/${windows_state}"
                fi
                break
              done

              if [[ "$full_state" == 'success' ]]; then
                break
              fi
              if [[ "$full_state" == failed:* ]]; then
                echo "Full Web CI run ${web_ci_run_id:-unknown} is not green (${full_state#failed:}); macOS jobs will not start." >&2
                exit 1
              fi
              if [[ "$attempt" == '120' ]]; then
                echo "Timed out waiting for successful Full Web CI jobs on exact head $checkout_ref." >&2
                exit 1
              fi
              sleep 15
            done

            short_head="${checkout_ref:0:7}"
            comments_file="$RUNNER_TEMP/pr-comments.json"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments_file"
            target_url="$(python3 - "$comments_file" "$short_head" <<'PY'
          import json
          import re
          import sys

          comments_path, short_head = sys.argv[1:]
          with open(comments_path, encoding='utf-8') as handle:
              comments = json.load(handle)

          pattern = re.compile(r'https://[0-9a-f]{8}\.owli-ai-assist-web\.pages\.dev')
          for comment in reversed(comments):
              user = comment.get('user') or {}
              body = comment.get('body') or ''
              if user.get('login') != 'cloudflare-workers-and-pages[bot]':
                  continue
              if short_head not in body or 'Deploy successful' not in body:
                  continue
              match = pattern.search(body)
              if match:
                  print(match.group(0))
                  break
          PY
            )"
          fi

          if [[ -n "$target_url" ]]; then
            python3 - "$target_url" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = sys.argv[1]
          parsed = urlparse(url)
          host = parsed.hostname or ''
          allowed = (
              parsed.scheme == 'https'
              and parsed.path in ('', '/')
              and not parsed.query
              and not parsed.fragment
              and parsed.username is None
              and parsed.password is None
              and parsed.port is None
              and (
                  host == 'assist-staging.owli-ai.com'
                  or host.endswith('.owli-ai-assist-web.pages.dev')
              )
          )
          if not allowed:
              raise SystemExit(f'Unsupported Apple smoke target: {url}')
          PY
          fi

          printf 'suite=%s\n' "$suite" >> "$GITHUB_OUTPUT"
          printf 'target_url=%s\n' "$target_url" >> "$GITHUB_OUTPUT"
          printf 'checkout_ref=%s\n' "$checkout_ref" >> "$GITHUB_OUTPUT"
          printf 'web_ci_run_id=%s\n' "$web_ci_run_id" >> "$GITHUB_OUTPUT"
          printf 'macos_enabled=%s\n' "$macos_enabled" >> "$GITHUB_OUTPUT"

          echo "Suite: $suite"
          echo "Exact checkout: $checkout_ref"
          echo "Full Web CI run: $web_ci_run_id"
          echo "Optional live target: ${target_url:-not available}"

  webkit:
    name: macOS Playwright WebKit
    needs: prepare
    if: >-
      ${{ needs.prepare.outputs.macos_enabled == '1' &&
          (needs.prepare.outputs.suite == 'all' || needs.prepare.outputs.suite == 'webkit') }}
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright WebKit only
        run: pnpm exec playwright install webkit

      - name: Run iPhone-profile WebKit matrix on macOS
        run: pnpm exec playwright test --project=webkit

      - name: Run built-staging WebKit matrix on macOS
        run: pnpm exec playwright test --config=playwright.staging.config.ts --project=webkit-staging

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-webkit-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  safari:
    name: macOS desktop Safari
    needs: prepare
    if: >-
      ${{ needs.prepare.outputs.macos_enabled == '1' &&
          (needs.prepare.outputs.suite == 'all' ||
           needs.prepare.outputs.suite == 'safari' ||
           needs.prepare.outputs.suite == 'safari-jpeg') }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TARGET_URL: ${{ needs.prepare.outputs.target_url }}
      SUITE: ${{ needs.prepare.outputs.suite }}
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused Safari smoke tests
        run: python3 tools/safari-smoke.test.py

      - name: Show Apple runner versions
        shell: bash
        run: |
          sw_vers
          safaridriver --version
          python3 --version
          node --version

      - name: Build deterministic Safari JPEG harness
        if: ${{ env.SUITE == 'safari-jpeg' || env.SUITE == 'all' }}
        run: pnpm build:safari-jpeg-harness

      - name: Start local HTTPS harness
        if: ${{ env.SUITE == 'safari-jpeg' || env.SUITE == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-safari/local-jpeg" "$RUNNER_TEMP/apple-safari/logs"
          server_log="$RUNNER_TEMP/apple-safari/logs/local-https-server.log"
          node tools/serve-built-web.mjs \
            --https \
            --port 4180 \
            --root tests/harness/safari-jpeg/dist \
            > "$server_log" 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$RUNNER_TEMP/apple-safari/local-https-server.pid"
          python3 tools/safari-smoke.py \
            --wait-for-local-https \
            --target-url https://127.0.0.1:4180/ \
            --server-pid "$server_pid" \
            --server-log "$server_log" \
            --readiness-timeout 90

      - name: Enable and start SafariDriver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-safari/local-jpeg" "$RUNNER_TEMP/apple-safari/live-readiness" "$RUNNER_TEMP/apple-safari/live-jpeg" "$RUNNER_TEMP/apple-safari/logs"
          sudo safaridriver --enable
          safaridriver -p 4444 > "$RUNNER_TEMP/apple-safari/logs/safaridriver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apple-safari/safaridriver.pid"
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4444/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/apple-safari/logs/safaridriver.log"
          exit 1

      - name: Run deterministic local Safari JPEG gate
        if: ${{ env.SUITE == 'safari-jpeg' || env.SUITE == 'all' }}
        shell: bash
        env:
          TESTED_REVISION: ${{ needs.prepare.outputs.checkout_ref }}
        run: |
          python3 tools/safari-jpeg-diagnostic.py \
            --target-url https://127.0.0.1:4180 \
            --artifacts "$RUNNER_TEMP/apple-safari/local-jpeg"

      - name: Run live readiness/privacy Safari smoke
        id: remote_readiness
        if: ${{ env.SUITE == 'safari' || env.SUITE == 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-safari/live-readiness"
          if [[ -z "$TARGET_URL" ]]; then
            cat > "$RUNNER_TEMP/apple-safari/live-readiness/result.json" <<'JSON'
          {
            "status": "INCONCLUSIVE_REMOTE_READINESS",
            "reason": "No immutable Cloudflare Pages preview was available for the exact PR head."
          }
          JSON
          else
            python3 tools/safari-smoke.py \
              --target-url "$TARGET_URL" \
              --artifacts "$RUNNER_TEMP/apple-safari/live-readiness" \
              --allow-inconclusive-remote-readiness
          fi
          status="$(python3 - "$RUNNER_TEMP/apple-safari/live-readiness/result.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              print(json.load(handle).get('status', 'FAIL'))
          PY
          )"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/apple-safari/live-readiness/result.json"

      - name: Preserve inconclusive remote JPEG artifact
        if: ${{ steps.remote_readiness.outputs.status == 'INCONCLUSIVE_REMOTE_READINESS' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apple-safari/live-jpeg"
          cp "$RUNNER_TEMP/apple-safari/live-readiness/result.json" \
            "$RUNNER_TEMP/apple-safari/live-jpeg/inconclusive-remote-readiness.json"

      - name: Run live Safari JPEG gate
        if: >-
          ${{ (env.SUITE == 'safari' || env.SUITE == 'all') && env.TARGET_URL != '' &&
              steps.remote_readiness.outcome == 'success' &&
              steps.remote_readiness.outputs.status != 'INCONCLUSIVE_REMOTE_READINESS' }}
        shell: bash
        env:
          TESTED_REVISION: ${{ needs.prepare.outputs.checkout_ref }}
        run: |
          set -euo pipefail
          python3 tools/safari-jpeg-diagnostic.py \
            --target-url "$TARGET_URL" \
            --artifacts "$RUNNER_TEMP/apple-safari/live-jpeg"

      - name: Stop local browser services
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/apple-safari/safaridriver.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/apple-safari/safaridriver.pid")" || true
          fi
          if [[ -f "$RUNNER_TEMP/apple-safari/local-https-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/apple-safari/local-https-server.pid")" || true
          fi

      - name: Upload local Safari JPEG diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-safari-local-jpeg-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-safari/local-jpeg/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload live readiness/privacy Safari smoke
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-safari-live-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-safari/live-readiness/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload live Safari JPEG diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-safari-live-jpeg-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-safari/live-jpeg/
          if-no-files-found: warn
          retention-days: 7
