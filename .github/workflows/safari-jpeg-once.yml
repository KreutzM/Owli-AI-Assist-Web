name: One-off Safari JPEG verification

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/safari-jpeg-once.yml

permissions:
  contents: read

concurrency:
  group: safari-jpeg-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safari-jpeg:
    name: macOS desktop Safari JPEG
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TESTED_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deterministic Safari JPEG harness
        run: pnpm build:safari-jpeg-harness

      - name: Start local HTTPS harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-safari/jpeg"
          node tools/serve-built-web.mjs --https --port 4180 > "$RUNNER_TEMP/apple-safari/jpeg/local-https-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apple-safari/local-https-server.pid"
          for attempt in {1..30}; do
            if curl --silent --fail --insecure https://127.0.0.1:4180/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Enable and start SafariDriver
        shell: bash
        run: |
          set -euo pipefail
          sudo safaridriver --enable
          safaridriver -p 4444 > "$RUNNER_TEMP/apple-safari/jpeg/safaridriver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/apple-safari/safaridriver.pid"
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4444/status > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run deterministic local Safari JPEG gate
        run: python3 tools/safari-jpeg-diagnostic-v2.py --target-url https://127.0.0.1:4180 --artifacts "$RUNNER_TEMP/apple-safari/jpeg"

      - name: Stop local browser services
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/apple-safari/safaridriver.pid" ]]; then kill "$(cat "$RUNNER_TEMP/apple-safari/safaridriver.pid")" || true; fi
          if [[ -f "$RUNNER_TEMP/apple-safari/local-https-server.pid" ]]; then kill "$(cat "$RUNNER_TEMP/apple-safari/local-https-server.pid")" || true; fi

      - name: Upload deterministic Safari JPEG diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-jpeg-once-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-safari/jpeg/
          if-no-files-found: warn
          retention-days: 7
