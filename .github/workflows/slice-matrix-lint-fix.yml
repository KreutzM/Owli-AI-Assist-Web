name: Slice matrix lint fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'pwa-mvp/camera-streaming-scene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply lint corrections and remove helpers
        run: |
          python <<'PY'
          from pathlib import Path

          tsconfig = Path('tsconfig.node.json')
          text = tsconfig.read_text()
          text = text.replace(
              '    "playwright.config.ts",\n',
              '    "playwright.config.ts",\n    "playwright.staging.config.ts",\n',
          )
          tsconfig.write_text(text)

          test = Path('tests/e2e/remote-staging.spec.ts')
          text = test.read_text()
          text = text.replace("liveRegion.textContent?.trim() ?? ''", "liveRegion.textContent.trim()")
          text = text.replace(
              "        const originalToBlob = HTMLCanvasElement.prototype.toBlob;\n        HTMLCanvasElement.prototype.toBlob = function (callback, type, quality) {\n",
              "        const originalToBlob = Object.getOwnPropertyDescriptor(\n          HTMLCanvasElement.prototype,\n          'toBlob',\n        )?.value as HTMLCanvasElement['toBlob'] | undefined;\n        if (!originalToBlob) throw new Error('Canvas toBlob is unavailable.');\n        HTMLCanvasElement.prototype.toBlob = function (callback, type, quality) {\n",
          )
          test.write_text(text)
          PY
          git rm .github/workflows/slice-matrix-lint.yml
          git rm .github/workflows/slice-matrix-lint-fix.yml
          pnpm format
          pnpm ai:index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test: satisfy matrix lint and project checks"
          git push origin HEAD:${{ github.head_ref }}
