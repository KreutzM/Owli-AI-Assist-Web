name: Web CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  payload-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct payload
        shell: bash
        run: |
          cat .github/slice4-modularization.part* | tr -d '\r\n[:space:]' > slice4-modularization.b64
          wc -c slice4-modularization.b64 > slice4-modularization.txt
          sha256sum slice4-modularization.b64 >> slice4-modularization.txt

      - name: Upload reconstructed payload
        uses: actions/upload-artifact@v4
        with:
          name: slice4-modularization-diagnostics
          path: |
            slice4-modularization.b64
            slice4-modularization.txt
          retention-days: 1
