name: Web CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ci-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize review remediation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize formatting
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "chore: format review remediation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run fast checks
        run: pnpm check:fast
