name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-source-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove source-transfer artifacts
        shell: bash
        run: rm -f .github/slice4-source-fix.part* .github/slice4-source-final.part*

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github
          git commit -m 'chore(web): remove Slice 4 source-transfer artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
