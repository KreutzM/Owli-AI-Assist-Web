name: Web CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-agent-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore final CI in working tree
        run: git show 7da85a60ef9445ff6c39b0c650d8eec45c6287c7:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate agent index against final workflow
        run: pnpm ai:index

      - name: Commit generated index only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/file-tree.md .ai/repo-index.json
          git commit -m 'chore(web): refresh E2E provenance index'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
