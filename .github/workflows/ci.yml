name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-remote-modules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format new remote modules
        run: pnpm exec prettier --write src/features/remote

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/features/remote; then
            exit 0
          fi
          git add src/features/remote
          git commit -m 'style(web): format modularized follow-up workflow'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
