name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-type-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply TypeScript fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sse = Path('src/core/api/followupSse.ts')
          text = sse.read_text().replace(
              '  let removeAbort = () => undefined;',
              '  let removeAbort: () => void = () => undefined;',
          )
          sse.write_text(text)

          speech = Path('src/platform/speech/browserSpeech.ts')
          text = speech.read_text().replace(
              "  synthesis?: Pick<SpeechSynthesis, 'cancel' | 'speak'>;\n"
              "  utteranceConstructor?: new (text?: string) => SpeechSynthesisUtterance;",
              "  synthesis?: Pick<SpeechSynthesis, 'cancel' | 'speak'> | undefined;\n"
              "  utteranceConstructor?:\n"
              "    | (new (text?: string) => SpeechSynthesisUtterance)\n"
              "    | undefined;",
          )
          speech.write_text(text)

          harness = Path('tests/harness/safari-jpeg/main.tsx')
          text = harness.read_text()
          text = text.replace(
              "import { BrowserSceneImageNormalizer } from '@/platform/image/browserSceneImageNormalizer';",
              "import { BrowserSceneImageNormalizer } from '@/platform/image/browserSceneImageNormalizer';\n"
              "import { BrowserSpeech } from '@/platform/speech/browserSpeech';",
          )
          text = text.replace(
              '  sceneDescribeEnabled: true;'.replace(';', ','),
              '  sceneDescribeEnabled: true,\n  followupEnabled: false,',
          )
          text = text.replace(
              '      normalizer={new BrowserSceneImageNormalizer()}\n      locale="de-DE"',
              '      normalizer={new BrowserSceneImageNormalizer()}\n'
              '      speech={new BrowserSpeech()}\n'
              '      locale="de-DE"',
          )
          harness.write_text(text)
          PY

      - name: Commit TypeScript fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'fix(web): satisfy Slice 4 type contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
