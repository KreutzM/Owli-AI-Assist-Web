name: Web CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-index-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export final repository index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out final read-only feature tree
        uses: actions/checkout@v4
        with:
          ref: 8241f3b912f38eb03c9efb33c7935fcecb860de8
          path: target

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Generate final repository index
        working-directory: target
        run: pnpm ai:index

      - name: Upload final repository index
        uses: actions/upload-artifact@v4
        with:
          name: final-repository-index
          path: |
            target/.ai/repo-index.json
            target/.ai/file-tree.md
          retention-days: 1
