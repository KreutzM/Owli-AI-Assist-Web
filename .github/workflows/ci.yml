name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, lint, unit, guardrails, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: pnpm format

      - name: Commit formatter output
        id: formatter
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository formatter"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop superseded run
        if: steps.formatter.outputs.changed == 'true'
        run: exit 0

      - name: Check formatting
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm format:check

      - name: Run lint
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm lint

      - name: Run typecheck
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm typecheck

      - name: Run architecture guardrails
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm guardrails

      - name: Run unit tests
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm test

      - name: Build production PWA
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm build

      - name: Verify agent index
        if: steps.formatter.outputs.changed != 'true'
        run: pnpm ai:index:check

  browser:
    name: Browser and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Chromium and WebKit smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
