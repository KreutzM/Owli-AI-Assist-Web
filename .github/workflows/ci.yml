name: Web CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Review remediation diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect lint, typecheck, guardrail and unit diagnostics
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          pnpm lint > diagnostics/lint.log 2>&1
          echo $? > diagnostics/lint.exit
          pnpm typecheck > diagnostics/typecheck.log 2>&1
          echo $? > diagnostics/typecheck.exit
          pnpm guardrails > diagnostics/guardrails.log 2>&1
          echo $? > diagnostics/guardrails.exit
          pnpm test > diagnostics/unit.log 2>&1
          echo $? > diagnostics/unit.exit
          exit 0

      - name: Upload review remediation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-remediation-diagnostics
          path: diagnostics/
          retention-days: 1

      - name: Enforce diagnostics
        shell: bash
        run: |
          test "$(cat diagnostics/lint.exit)" = "0"
          test "$(cat diagnostics/typecheck.exit)" = "0"
          test "$(cat diagnostics/guardrails.exit)" = "0"
          test "$(cat diagnostics/unit.exit)" = "0"
