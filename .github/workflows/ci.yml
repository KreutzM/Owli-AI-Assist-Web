name: Web CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      tier:
        description: Validation tier
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
      ref:
        description: Optional branch, tag, or SHA to validate
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  quick:
    name: Quick format, type, unit, and build checks
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'quick')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quick repository checks
        run: pnpm check:fast

      - name: Build mock PWA
        run: pnpm build

  full-linux:
    name: Full Linux aggregate and browser validation
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'full') ||
      (github.event_name == 'pull_request' &&
        (github.event.action != 'synchronize' || github.event.pull_request.draft == false))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve exact checkout SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run final aggregate checks once
        run: pnpm check:all

      - name: Check Safari diagnostics syntax
        run: |
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py
          node tools/check-safari-smoke-guards.mjs
          rm -rf tools/__pycache__

      - name: Build deterministic Safari JPEG harness
        run: |
          pnpm build:safari-jpeg-harness
          if grep -qE 'api-staging\.owli-ai\.com|https://api\.owli-ai\.com' dist/_headers; then
            echo 'Safari JPEG harness headers contain a remote API origin.' >&2
            exit 1
          fi

      - name: Generate optional agent index artifact
        run: pnpm ai:index

      - name: Upload optional agent index artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-index-${{ steps.revision.outputs.sha }}
          path: artifacts/agent-index/
          if-no-files-found: error
          retention-days: 1

  full-windows:
    name: Full Windows mock, staging, and production builds
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'full') ||
      (github.event_name == 'pull_request' &&
        (github.event.action != 'synchronize' || github.event.pull_request.draft == false))
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock PWA and verify headers
        shell: pwsh
        run: |
          pnpm build
          $headers = Get-Content dist/_headers -Raw
          if ($headers.Contains('api-staging.owli-ai.com') -or $headers.Contains('https://api.owli-ai.com')) { throw 'Mock headers contain a remote API origin.' }

      - name: Build staging PWA and verify headers
        shell: pwsh
        run: |
          pnpm build:staging
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api-staging.owli-ai.com')) { throw 'Staging connect-src is missing.' }
          if ($headers.Contains('https://api.owli-ai.com')) { throw 'Staging headers contain the production API origin.' }

      - name: Build production PWA and verify headers
        shell: pwsh
        run: |
          pnpm build:production
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api.owli-ai.com')) { throw 'Production connect-src is missing.' }
          if ($headers.Contains('api-staging.owli-ai.com')) { throw 'Production headers contain the staging API origin.' }
