name: Web CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  type-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture type diagnostics
        run: pnpm typecheck 2>&1 | tee typecheck.log

      - name: Upload type diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-4-typecheck
          path: typecheck.log
          retention-days: 1
