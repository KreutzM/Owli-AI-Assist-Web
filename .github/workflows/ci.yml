name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, lint, unit, guardrails, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run architecture guardrails
        run: pnpm guardrails

      - name: Run unit tests
        run: pnpm test

      - name: Check Safari diagnostics syntax
        run: |
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py
          node tools/check-safari-smoke-guards.mjs
          rm -rf tools/__pycache__

      - name: Build mock PWA
        run: pnpm build

      - name: Verify occupied ports fail fast
        run: pnpm test:ports

      - name: Build staging PWA and headers
        run: pnpm build:staging

      - name: Build production PWA and headers
        run: pnpm build:production

      - name: Build deterministic Safari JPEG harness
        run: |
          pnpm build:safari-jpeg-harness
          if grep -qE 'https://api-staging\.owli-ai\.com|https://api\.owli-ai\.com' dist/_headers; then
            echo 'Safari JPEG harness headers contain a remote API origin.' >&2
            exit 1
          fi

      - name: Generate agent index
        run: pnpm ai:index

      - name: Upload generated agent index
        uses: actions/upload-artifact@v4
        with:
          name: generated-agent-index
          path: |
            .ai/file-tree.md
            .ai/repo-index.json
          retention-days: 1

      - name: Verify agent index
        run: git diff --exit-code -- .ai/file-tree.md .ai/repo-index.json

  windows-builds:
    name: Windows mock, staging, and production builds
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock PWA and verify headers
        shell: pwsh
        run: |
          pnpm build
          $headers = Get-Content dist/_headers -Raw
          if ($headers.Contains('https://api-staging.owli-ai.com') -or $headers.Contains('https://api.owli-ai.com')) { throw 'Mock headers contain a remote API origin.' }

      - name: Build staging PWA and verify headers
        shell: pwsh
        run: |
          pnpm build:staging
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api-staging.owli-ai.com')) { throw 'Staging connect-src is missing.' }
          if ($headers.Contains('https://api.owli-ai.com')) { throw 'Staging headers contain the production API origin.' }

      - name: Build production PWA and verify headers
        shell: pwsh
        run: |
          pnpm build:production
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api.owli-ai.com')) { throw 'Production connect-src is missing.' }
          if ($headers.Contains('https://api-staging.owli-ai.com')) { throw 'Production headers contain the staging API origin.' }

  browser:
    name: Browser, built staging, and accessibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run isolated Chromium and WebKit remote-state matrix
        run: pnpm test:e2e

      - name: Run built staging Chromium and WebKit matrix
        run: pnpm test:e2e:staging

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
