name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-safari-readiness-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write focused Safari diagnostic fix
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > tools/safari-jpeg-diagnostic.py

      - name: Validate and refresh generated index
        shell: bash
        run: |
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py
          node tools/check-safari-smoke-guards.mjs
          rm -rf tools/__pycache__
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm ai:index
          git diff --check

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/safari-jpeg-diagnostic.py .ai/file-tree.md .ai/repo-index.json
          git commit -m 'test(web): classify remote Safari readiness as inconclusive'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
