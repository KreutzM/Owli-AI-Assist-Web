name: Web CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-all-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit

      - name: Capture check-all stages
        shell: bash
        run: |
          set +e
          : > exit-codes.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "${name}.log" 2>&1
            code=$?
            echo "${name}=${code}" | tee -a exit-codes.txt
          }
          run_stage check-fast pnpm check:fast
          run_stage build pnpm build
          run_stage ports pnpm test:ports
          run_stage e2e pnpm test:e2e
          run_stage e2e-staging pnpm test:e2e:staging
          run_stage ai-index pnpm ai:index:check

      - name: Upload check-all diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: slice4-check-all-diagnostics
          path: |
            exit-codes.txt
            check-fast.log
            build.log
            ports.log
            e2e.log
            e2e-staging.log
            ai-index.log
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1
