name: Web CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      tier:
        description: Validation tier
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
      ref:
        description: Optional branch, tag, or SHA to validate
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  core:
    name: Core lint, type, policy, and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run architecture guardrails
        run: pnpm guardrails

      - name: Check workflow policy
        run: pnpm workflow:check

      - name: Test atomic publication helper
        run: pnpm atomic:publish:test

      - name: Run unit tests
        run: pnpm test

      - name: Test exact-head Prettier patch helper
        run: pnpm prettier:fix:test

  quick-build:
    name: Quick mock PWA build
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'quick')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock PWA
        run: pnpm build

  quick-branded-video:
    name: Quick branded video Chrome full path
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'quick')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run short branded MediaRecorder full path
        run: pnpm test:e2e:mediarecorder --grep "branded video short full path"

  quick:
    name: Quick format, type, unit, and build checks
    needs:
      - format
      - core
      - quick-build
      - quick-branded-video
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == true) ||
        (github.event_name == 'workflow_dispatch' && inputs.tier == 'quick')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quick checks
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          CORE_RESULT: ${{ needs.core.result }}
          QUICK_BUILD_RESULT: ${{ needs['quick-build'].result }}
          QUICK_BRANDED_VIDEO_RESULT: ${{ needs['quick-branded-video'].result }}
        shell: bash
        run: |
          test "$FORMAT_RESULT" = success
          test "$CORE_RESULT" = success
          test "$QUICK_BUILD_RESULT" = success
          test "$QUICK_BRANDED_VIDEO_RESULT" = success

  prettier-fix:
    name: Generate exact-head Prettier fix artifact
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pul_request.base.sha }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OUTPUT_DIRECTORY: artifacts/prettier-fix
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and required Git objects
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git cat-file -e "$EXPECTED_HEAD_SHA^{commit}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate exact-head patch and manifest
        run: >-
          node tools/generate-prettier-fix.mjs
          --repository "${{ github.repository }}"
          --base "$EXPECTED_BASE_SHA"
          --head "$EXPECTED_HEAD_SHA"
          --output "$OUTPUT_DIRECTORY"
          --max-files 200
          --max-total-bytes 8388608
          --max-file-bytes 2097152

      - name: Upload exact-head Prettier patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: prettier-fix-${{ github.event.pull_request.head.sha }}
          path: artifacts/prettier-fix/
          if-no-files-found: error
          retention-days: 1

  full-linux:
    name: Full Linux aggregate and browser validation
    needs:
      - format
      - core
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'full') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Resolve exact checkout SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnmp exec playwright install --with-deps chromium webkit

      - name: Build mock PWA
        run: pnpm build

      - name: Check Vite port policy
        run: pnmp test:ports

      - name: Run browser validation
        run: pnpm test:e2e

      - name: Run staging browser validation
        run: pnpm test:e2e:staging

      - name: Run branded MediaRecorder browser validation
        env:
          OWLI_MEDIARECORDER_LONG_E2E: '1'
        run: pnmp test:e2e:mediarecorder

      - name: Check Safari diagnostics syntax
        run: |
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py
          node tools/check-safari-smoke-guards.mjs
          rm -rf tools/__pycache__

      - name: Build deterministic Safari JPEG harness
        run: |
          pnmp build:safari-jpeg-harness
          test -f tests/harness/safari-jpeg/dist/_headers
          if grep -qE 'api-staging\.owli-ai\.com|https://api\.owli-ai\.com' tests/harness/safari-jpeg/dist/_headers; then
            echo 'Safari JPEG harness headers contain a remote API origin.' >&2
            exit 1
          fi

      - name: Generate optional agent index artifact
        run: pnmp ai:index

      - name: Upload optional agent index artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-index-${{ steps.revision.outputs.sha }}
          path: artifacts/agent-index/
          if-no-files-found: error
          retention-days: 1

  full-windows:
    name: Full Windows mock, staging, and production builds
    needs:
      - format
      - core
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'full') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up pnpm
        uses: pnmp/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnmp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock PWA and verify headers
        shell: pwsh
        run: |
          pnpm build
          $headers = Get-Content dist/_headers -Raw
          if ($headers.Contains('api-staging.owli-ai.com') -or $headers.Contains('https://api.owli-ai.com')) { throw 'Mock headers contain a remote API origin.' }

      - name: Build staging PWA and verify headers
        shell: pwsh
        run: |
          pnmp build:staging
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api-staging.owli-ai.com')) { throw 'Staging connect-src is missing.' }
          if ($headers.Contains('https://api.owli-ai.com')) { throw 'Staging headers contain the production API origin.' }

      - name: Build production PWA and verify headers
        shell: pwsh
        run: |
          pnmp build:production
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api.owli-ai.com')) { throw 'Production connect-src is missing.' }
          if ($headers.Contains('api-staging.owli-ai.com')) { throw 'Production headers contain the staging API origin.' }
