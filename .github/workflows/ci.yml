name: Web CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package current source
        run: tar -czf source-snapshot.tgz src tests tools docs .github package.json pnpm-lock.yaml tsconfig*.json vite.config.ts playwright*.ts eslint.config.js

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: slice-4-source-snapshot
          path: source-snapshot.tgz
          retention-days: 1
