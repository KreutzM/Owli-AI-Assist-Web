name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, lint, unit, guardrails, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run architecture guardrails
        run: pnpm guardrails

      - name: Run unit tests
        run: pnpm test

      - name: Check Safari diagnostics syntax
        run: |
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py tools/safari-jpeg-diagnostic-v2.py
          rm -rf tools/__pycache__

      - name: Build mock PWA
        run: pnpm build

      - name: Verify occupied ports fail fast
        run: pnpm test:ports

      - name: Build staging PWA and headers
        run: pnpm build:staging

      - name: Build production PWA and headers
        run: pnpm build:production

      - name: Build deterministic Safari JPEG harness
        run: |
          pnpm build:safari-jpeg-harness
          if grep -qE 'owli-ai-backend-staging|https://api\.owli-ai\.com' dist/_headers; then
            echo 'Safari JPEG harness headers contain a remote API origin.' >&2
            exit 1
          fi

      - name: Generate agent index
        run: pnpm ai:index

      - name: Upload generated agent index
        uses: actions/upload-artifact@v4
        with:
          name: generated-agent-index
          path: |
            .ai/file-tree.md
            .ai/repo-index.json
          retention-days: 1

      - name: Verify agent index
        run: git diff --exit-code -- .ai/file-tree.md .ai/repo-index.json

  windows-builds:
    name: Windows mock, staging, and production builds
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mock PWA and verify headers
        shell: pwsh
        run: |
          pnpm build
          $headers = Get-Content dist/_headers -Raw
          if ($headers.Contains('owli-ai-backend-staging') -or $headers.Contains('https://api.owli-ai.com')) { throw 'Mock headers contain a remote API origin.' }

      - name: Build staging PWA and verify headers
        shell: pwsh
        run: |
          pnpm build:staging
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://owli-ai-backend-staging.michael-kreutzer-77.workers.dev')) { throw 'Staging connect-src is missing.' }
          if ($headers.Contains('https://api.owli-ai.com')) { throw 'Staging headers contain the production API origin.' }

      - name: Build production PWA and verify headers
        shell: pwsh
        run: |
          pnpm build:production
          $headers = Get-Content dist/_headers -Raw
          if (-not $headers.Contains('connect-src ''self'' https://api.owli-ai.com')) { throw 'Production connect-src is missing.' }
          if ($headers.Contains('owli-ai-backend-staging')) { throw 'Production headers contain the staging API origin.' }

  browser:
    name: Browser, built staging, and accessibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run isolated Chromium and WebKit remote-state matrix
        run: pnpm test:e2e

      - name: Run built staging Chromium and WebKit matrix
        run: pnpm test:e2e:staging

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # BEGIN ONE-OFF PR32 CLEANUP
  apply-review-cleanup:
    name: Apply requested Safari cleanup
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-legacy-safari-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-safari-diagnostic
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply cleanup and remove this one-off job
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          canonical = Path('tools/safari-jpeg-diagnostic.py')
          source = canonical.read_text(encoding='utf-8')
          padding_marker = '\n# Compatibility note:'
          if padding_marker not in source:
              raise SystemExit('Expected byte-size padding marker was not found.')
          canonical.write_text(source.split(padding_marker, 1)[0].rstrip() + '\n', encoding='utf-8')

          duplicate = Path('tools/safari-jpeg-diagnostic-v2.py')
          if not duplicate.is_file():
              raise SystemExit('Expected duplicate Safari diagnostic was not found.')
          duplicate.unlink()

          apple = Path('.github/workflows/apple-smoke.yml')
          apple_source = apple.read_text(encoding='utf-8')
          if apple_source.count('safari-jpeg-diagnostic-v2.py') != 1:
              raise SystemExit('Expected exactly one Apple v2 reference.')
          apple.write_text(
              apple_source.replace('safari-jpeg-diagnostic-v2.py', 'safari-jpeg-diagnostic.py'),
              encoding='utf-8',
          )

          ci = Path('.github/workflows/ci.yml')
          ci_source = ci.read_text(encoding='utf-8')
          begin = '\n  # BEGIN ONE-OFF PR32 CLEANUP\n'
          end = '\n  # END ONE-OFF PR32 CLEANUP\n'
          if begin not in ci_source or end not in ci_source:
              raise SystemExit('Expected one-off cleanup markers were not found.')
          before, remainder = ci_source.split(begin, 1)
          _, after = remainder.split(end, 1)
          ci_source = before.rstrip() + '\n' + after.lstrip()
          old_ci = 'python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py tools/safari-jpeg-diagnostic-v2.py'
          new_ci = 'python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py'
          if old_ci not in ci_source:
              raise SystemExit('Expected CI v2 syntax reference was not found.')
          ci.write_text(ci_source.replace(old_ci, new_ci), encoding='utf-8')

          temporary_workflow = Path('.github/workflows/pr32-cleanup.yml')
          if temporary_workflow.exists():
              temporary_workflow.unlink()
          PY

      - name: Regenerate repository index
        run: pnpm ai:index

      - name: Validate cleanup
        shell: bash
        run: |
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py
          test ! -e tools/safari-jpeg-diagnostic-v2.py
          ! grep -R --line-number --fixed-strings 'safari-jpeg-diagnostic-v2.py' .github tools .ai
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(safari): remove duplicate diagnostic entry'
          git push origin HEAD:agent/remove-legacy-safari-diagnostic
  # END ONE-OFF PR32 CLEANUP
