name: Web CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-focused-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply focused fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('src/core/api/remoteAssistClient.ts')
          text = client.read_text()
          text = text.replace('consumeSceneSse(response.body!, {', 'consumeSceneSse(response.body, {')
          text = text.replace('consumeFollowupSse(response.body!, {', 'consumeFollowupSse(response.body, {')
          client.write_text(text)

          workflow = Path('src/features/remote/useRemoteScene.ts')
          text = workflow.read_text()
          text = text.replace(
              '    if (Date.parse(currentContext.sceneTokenExpiresAt) <= Date.now()) {',
              '    const sceneExpiresAt = Date.parse(currentContext.sceneTokenExpiresAt);\n'
              '    if (!Number.isFinite(sceneExpiresAt) || sceneExpiresAt <= Date.now()) {',
          )
          text = text.replace(
              '  if (!currentImage || Date.parse(result.sceneTokenExpiresAt) <= Date.now()) return undefined;',
              '  const sceneExpiresAt = Date.parse(result.sceneTokenExpiresAt);\n'
              '  if (!Number.isFinite(sceneExpiresAt) || sceneExpiresAt <= Date.now()) return undefined;',
          )
          workflow.write_text(text)

          old = 'owli-ai-backend-staging.michael-kreutzer-77.workers.dev'
          new = 'api-staging.owli-ai.com'
          for root in ('src', 'tests', 'tools', 'docs'):
              for path in Path(root).rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      source = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if old in source:
                      path.write_text(source.replace(old, new))
          PY

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests tools docs
          git commit -m 'fix(web): harden follow-up validation and staging provenance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
