name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-agent-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Restore final CI workflow in working tree
        shell: bash
        run: git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate final agent index
        run: pnpm ai:index

      - name: Verify final working tree
        shell: bash
        run: |
          git diff --check
          git diff --name-only

      - name: Commit final workflow and agent index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .ai/file-tree.md .ai/repo-index.json
          git commit -m 'chore(web): finalize generated agent index'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
