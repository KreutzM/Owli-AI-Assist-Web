name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup-transfer-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove transfer artifacts
        shell: bash
        run: rm -f .github/slice4-modularization.b64 .github/slice4-modularization.part*

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/slice4-modularization.b64 .github/slice4-modularization.part00 .github/slice4-modularization.part01 .github/slice4-modularization.part02 .github/slice4-modularization.part03 .github/slice4-modularization.part04 .github/slice4-modularization.part05 .github/slice4-modularization.part06 .github/slice4-modularization.part07
          git commit -m 'chore(web): remove modularization transfer artifacts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
