name: Web CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture unit diagnostics
        shell: bash
        run: pnpm test > unit.log 2>&1 || true

      - name: Upload unit diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: slice4-unit-diagnostics
          path: unit.log
          retention-days: 1
