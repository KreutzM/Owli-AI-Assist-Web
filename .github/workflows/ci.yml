name: Web CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-agent-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Write exact generated index
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > .ai/file-tree.md
          printf '%s' '' | base64 --decode | gzip --decompress > .ai/repo-index.json
          git diff --check

      - name: Commit exact index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/file-tree.md .ai/repo-index.json
          git commit -m 'chore(ai): refresh generated repository index'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
