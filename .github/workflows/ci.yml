name: Web CI

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  previous-check-all-log:
    runs-on: ubuntu-latest
    steps:
      - name: Download previous aggregate job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89550876083/logs" \
            --output aggregate.log
          tail -n 500 aggregate.log > aggregate-tail.log

      - name: Upload aggregate log
        uses: actions/upload-artifact@v4
        with:
          name: slice4-aggregate-job-log
          path: |
            aggregate.log
            aggregate-tail.log
          retention-days: 1
