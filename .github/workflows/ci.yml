name: Web CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatted-source-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified source fix
        shell: bash
        run: |
          cat .github/slice4-source-fix.part* | tr -d '\r\n[:space:]' > /tmp/slice4-source-fix.b64
          test "$(wc -c < /tmp/slice4-source-fix.b64)" = "9896"
          echo 'db0191ec2afbde6a89e1cd651e1ae5222a1ae075672466796bf67d397776572a  /tmp/slice4-source-fix.b64' | sha256sum --check
          base64 --decode /tmp/slice4-source-fix.b64 > /tmp/slice4-source-fix.tgz
          echo 'bd906119d9b3e473da26eee38b531892250e6812f67e6329f01622fa373a3339  /tmp/slice4-source-fix.tgz' | sha256sum --check
          tar -xzf /tmp/slice4-source-fix.tgz

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and capture diagnostics
        shell: bash
        run: |
          pnpm exec prettier --write src/core/api/remoteAssistClient.ts src/features/remote/remoteSceneState.ts src/features/remote/useRemoteRequestLifecycle.ts src/features/remote/useRemoteFollowup.ts src/features/remote/useRemoteScene.ts > prettier.log 2>&1
          pnpm lint > lint.log 2>&1 || true
          pnpm typecheck > typecheck.log 2>&1 || true
          pnpm guardrails > guardrails.log 2>&1 || true
          wc -l src/features/remote/useRemoteScene.ts src/features/remote/remoteSceneState.ts > line-counts.log

      - name: Upload formatted source and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: slice4-formatted-source-fix
          path: |
            src/core/api/remoteAssistClient.ts
            src/features/remote/remoteSceneState.ts
            src/features/remote/useRemoteRequestLifecycle.ts
            src/features/remote/useRemoteFollowup.ts
            src/features/remote/useRemoteScene.ts
            prettier.log
            lint.log
            typecheck.log
            guardrails.log
            line-counts.log
          retention-days: 1
