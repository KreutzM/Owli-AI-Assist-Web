name: Web CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ci-finalize-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: Finalize workflow and repository index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write final read-only workflow
        shell: bash
        run: echo '' | base64 --decode > .github/workflows/ci.yml

      - name: Generate repository index
        run: pnpm ai:index

      - name: Check generated formatting
        run: pnpm format:check

      - name: Check generated index
        run: pnpm ai:index:check

      - name: Commit final files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .ai/repo-index.json .ai/file-tree.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize repository index'
            git push origin HEAD:${{ github.head_ref }}
          fi
