name: Slice unit diagnostic

on:
  pull_request:

jobs:
  unit-diagnostic:
    if: github.head_ref == 'pwa-mvp/camera-streaming-scene'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture unit output
        run: pnpm test > unit-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: slice-unit-output
          path: unit-output.txt
          retention-days: 1
