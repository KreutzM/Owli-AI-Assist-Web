name: Slice staging smoke

on:
  pull_request:

jobs:
  staging-smoke:
    if: github.head_ref == 'pwa-mvp/camera-streaming-scene'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run synthetic staging SSE smoke
        env:
          EXPECTED_STAGING_VERSION: 72f01e14-54b2-48b1-ac39-bf5151be1c4f
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee staging-smoke-output.txt
          const base = 'https://owli-ai-backend-staging.michael-kreutzer-77.workers.dev/';
          const installationId = crypto.randomUUID();
          const imageBase64 = '';
          const getJson = async (path, init = {}) => {
            const response = await fetch(new URL(path, base), init);
            if (!response.ok) throw new Error(`${path} HTTP ${response.status}: ${await response.text()}`);
            return { response, json: await response.json() };
          };
          const config = await getJson('/api/v1/config', { headers: { Accept: 'application/json' } });
          if (config.json.environment !== 'staging' || config.json.features?.sceneDescribe !== true) {
            throw new Error(`unexpected config ${JSON.stringify(config.json)}`);
          }
          const bootstrap = await getJson('/api/v1/session/bootstrap', {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ appVersion: '0.1.0', versionCode: 1, platform: 'web', locale: 'de-DE', installationId }),
          });
          const profiles = await getJson('/api/v1/profiles', { headers: { Accept: 'application/json' } });
          const allowed = new Set(config.json.profiles.backendSupportedProfileIds);
          const profile = profiles.json.profiles.find((candidate) =>
            allowed.has(candidate.id) && candidate.transports?.backend?.available === true && candidate.transports.backend.supportsStreaming === true
          );
          if (!profile) throw new Error('no streaming backend profile');
          const response = await fetch(new URL('/api/v1/scene/describe', base), {
            method: 'POST',
            headers: { Accept: 'text/event-stream', 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionToken: bootstrap.json.sessionToken,
              installationId,
              imageBase64,
              imageMimeType: 'image/jpeg',
              sceneMode: 'describe',
              stream: true,
              profileId: profile.id,
              locale: 'de-DE',
            }),
          });
          const contentType = response.headers.get('content-type') ?? '';
          if (!response.ok || !contentType.toLowerCase().startsWith('text/event-stream')) {
            throw new Error(`scene HTTP ${response.status} ${contentType}: ${await response.text()}`);
          }
          const body = await response.text();
          const events = body.split(/\n\n+/u).map((block) => {
            const name = block.split('\n').find((line) => line.startsWith('event: '))?.slice(7);
            const data = block.split('\n').filter((line) => line.startsWith('data: ')).map((line) => line.slice(6)).join('\n');
            return name ? { name, data: data ? JSON.parse(data) : null } : null;
          }).filter(Boolean);
          const names = events.map((event) => event.name);
          if (!names.includes('metadata') || !names.includes('done') || names.includes('error')) {
            throw new Error(`unexpected SSE events ${JSON.stringify(names)} body=${body}`);
          }
          const done = events.find((event) => event.name === 'done')?.data;
          if (!done?.answerText || !done?.requestId || done.profileId !== profile.id) {
            throw new Error(`invalid done event ${JSON.stringify(done)}`);
          }
          const versionHeaders = Object.fromEntries([...response.headers].filter(([name]) => /version|deployment|cf-ray/u.test(name)));
          console.log(JSON.stringify({
            expectedStagingVersion: process.env.EXPECTED_STAGING_VERSION,
            environment: config.json.environment,
            profileId: profile.id,
            eventNames: names,
            cleanEof: true,
            answerLength: done.answerText.length,
            versionHeaders,
            userContent: false,
            syntheticImageBytes: 2126,
            syntheticImageSha256: 'a5878b5ede9503ac87a06f92a3cd7bf9682a5768f378f945798dbef00d8321e4',
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slice-staging-smoke
          path: staging-smoke-output.txt
          retention-days: 7
