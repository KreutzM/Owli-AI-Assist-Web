name: PR 32 cleanup

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/pr32-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/remove-legacy-safari-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-legacy-safari-diagnostic
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply requested cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          canonical = Path('tools/safari-jpeg-diagnostic.py')
          source = canonical.read_text(encoding='utf-8')
          marker = '\n# Compatibility note:'
          if marker not in source:
              raise SystemExit('Expected byte-size padding marker was not found.')
          canonical.write_text(source.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')

          duplicate = Path('tools/safari-jpeg-diagnostic-v2.py')
          if not duplicate.is_file():
              raise SystemExit('Expected duplicate Safari diagnostic was not found.')
          duplicate.unlink()

          apple = Path('.github/workflows/apple-smoke.yml')
          apple_source = apple.read_text(encoding='utf-8')
          if apple_source.count('safari-jpeg-diagnostic-v2.py') != 1:
              raise SystemExit('Expected exactly one Apple v2 reference.')
          apple.write_text(
              apple_source.replace('safari-jpeg-diagnostic-v2.py', 'safari-jpeg-diagnostic.py'),
              encoding='utf-8',
          )

          ci = Path('.github/workflows/ci.yml')
          ci_source = ci.read_text(encoding='utf-8')
          begin = '\n  # BEGIN ONE-OFF PR32 CLEANUP\n'
          end = '\n  # END ONE-OFF PR32 CLEANUP\n'
          if begin not in ci_source or end not in ci_source:
              raise SystemExit('Expected one-off cleanup markers were not found.')
          before, remainder = ci_source.split(begin, 1)
          _, after = remainder.split(end, 1)
          ci_source = before.rstrip() + '\n' + after.lstrip()
          old = 'python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py tools/safari-jpeg-diagnostic-v2.py'
          new = 'python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py'
          if old not in ci_source:
              raise SystemExit('Expected CI v2 reference was not found.')
          ci.write_text(ci_source.replace(old, new), encoding='utf-8')

          Path('.github/workflows/pr32-cleanup.yml').unlink()
          PY
          pnpm ai:index
          python3 -m py_compile tools/safari-smoke.py tools/safari-jpeg-diagnostic.py
          test ! -e tools/safari-jpeg-diagnostic-v2.py
          ! grep -R --line-number --fixed-strings 'safari-jpeg-diagnostic-v2.py' .github tools .ai
          git diff --check

      - name: Commit atomically through Git database API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'agent/remove-legacy-safari-diagnostic'

          def gh(method, endpoint, payload=None):
              command = ['gh', 'api', '--method', method, endpoint]
              if payload is not None:
                  command += ['--input', '-']
              result = subprocess.run(
                  command,
                  input=json.dumps(payload) if payload is not None else None,
                  text=True,
                  check=True,
                  capture_output=True,
              )
              return json.loads(result.stdout) if result.stdout.strip() else {}

          ref = gh('GET', f'repos/{repo}/git/ref/heads/{branch}')
          parent = ref['object']['sha']
          commit = gh('GET', f'repos/{repo}/git/commits/{parent}')
          entries = []
          for path in (
              'tools/safari-jpeg-diagnostic.py',
              '.github/workflows/apple-smoke.yml',
              '.github/workflows/ci.yml',
              '.ai/file-tree.md',
              '.ai/repo-index.json',
          ):
              content = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = gh('POST', f'repos/{repo}/git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.extend((
              {'path': 'tools/safari-jpeg-diagnostic-v2.py', 'mode': '100644', 'type': 'blob', 'sha': None},
              {'path': '.github/workflows/pr32-cleanup.yml', 'mode': '100644', 'type': 'blob', 'sha': None},
          ))
          tree = gh(
              'POST',
              f'repos/{repo}/git/trees',
              {'base_tree': commit['tree']['sha'], 'tree': entries},
          )
          new_commit = gh(
              'POST',
              f'repos/{repo}/git/commits',
              {
                  'message': 'fix(safari): remove duplicate diagnostic entry',
                  'tree': tree['sha'],
                  'parents': [parent],
              },
          )
          gh(
              'PATCH',
              f'repos/{repo}/git/refs/heads/{branch}',
              {'sha': new_commit['sha'], 'force': False},
          )
          print(new_commit['sha'])
          PY
